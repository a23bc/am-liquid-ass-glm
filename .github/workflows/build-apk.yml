name: Build Release APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Ensure Android SDK packages
        run: |
          # ubuntu-latest ships with platforms;android-35 + build-tools;35.0.0
          # + platform-tools pre-installed. Run sdkmanager directly to
          # accept licenses + fill in any missing piece — we deliberately
          # avoid android-actions/setup-android@v3 because it mishandles
          # the multiline `packages:` input on the runner's cmdline-tools/16.0.
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "Using sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          for pkg in "platforms;android-35" "build-tools;35.0.0" "platform-tools"; do
            "$SDKMANAGER" --install "$pkg" || echo "ignored: $pkg (likely already installed)"
          done
          "$SDKMANAGER" --list_installed || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Locate built APK
        run: |
          echo "Searching for built APK..."
          find app/build/outputs -name "*.apk" -type f || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amliquidass-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
